[project]
name = "at2-qts-app"
version = "0.1.0"
description = "Aplicação de Gestão de Ordens de Serviço - AT2 QTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-playwright>=0.4.4",
    "axe-playwright-python>=0.1.1",
    "faker>=24.0.0",
    "locust>=2.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: Testes de integração de API e Mocks",
    "e2e: Testes End-to-End com Playwright",
    "accessibility: Auditoria de acessibilidade WCAG",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]